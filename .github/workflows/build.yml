name: Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            os: windows-latest
            args: ""
          - platform: ubuntu-latest
            os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # FIX: Force Windows to checkout only the top-level files, bypassing history logs
      - name: Checkout repository (Windows History Bypass)
        if: matrix.platform == 'windows-latest'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            src-tauri
          sparse-checkout-cone-mode: false

      # Standard checkout for Mac and Linux
      - name: Checkout repository (Standard)
        if: matrix.platform != 'windows-latest'
        uses: actions/checkout@v4

      # FIX: Manually restore missing workspace files for Windows without using Git checkout
      - name: Clean up Windows paths
        if: matrix.platform == 'windows-latest'
        run: |
          git config --global core.protectNTFS false
          git checkout HEAD -- src-tauri/
        shell: bash

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Rust (macOS)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Rust (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: 'Packet Launcher v__VERSION__'
          releaseBody: 'Automated release from GitHub Actions'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
