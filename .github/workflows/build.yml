name: Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            os: windows-latest
            args: ""
          - platform: ubuntu-latest
            os: ubuntu-latest # Restores Ubuntu 24.04 for Tauri v2 / 4.1 support
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # FIX: Injects NTFS bypass flags dynamically into the checkout environment variables 
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_GLOBAL: 'core.protectNTFS=false'
          GIT_CONFIG_PARAMETERS: "'core.protectNTFS=false' 'core.longpaths=true'"
        with:
          set-safe-directory: true

      # FIX: Wipe the physical bad file out on the Windows runner if it leaks past checkout
      - name: Clean Invalid Ghost Files (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          git rm --cached -r "src/lib.rs:939:3" --ignore-unmatch || true
        shell: bash

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Rust (macOS)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Rust (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # FIX: Installed modern webkit2gtk 4.1 and javascriptcoregtk 4.1 packages
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: 'Packet Launcher v__VERSION__'
          releaseBody: 'Automated release from GitHub Actions'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
