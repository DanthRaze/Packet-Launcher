name: Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build (${{ matrix.name }}) # FIX: This gives you clean readable names on GitHub
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos-latest
            name: "MacOS Intel chips"
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            os: macos-latest
            name: "MacOS Apple Silicon"
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            os: windows-latest
            name: "Windows x64"
            args: ""
          - platform: ubuntu-latest
            os: ubuntu-latest
            name: "Linux x64"
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # FIX: Raw terminal checkout for Windows that forces NTFS safety checks off before pulling data
      - name: Manual Git Checkout (Windows Fix)
        if: matrix.platform == 'windows-latest'
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true
          git init .
          git remote add origin https://github.com
          git fetch --depth 1 origin refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}
          git checkout refs/tags/${{ github.ref_name }} --force
        shell: bash

      # Standard checkout works perfectly for Mac and Linux
      - name: Checkout repository (Standard Mac/Linux)
        if: matrix.platform != 'windows-latest'
        uses: actions/checkout@v4

      # Ensure the runner path permissions are completely clear
      - name: Trust Repository Folder
        run: git config --global --add safe.directory "*"
        shell: bash

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Rust (macOS)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Rust (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.7' }}
          releaseName: 'Packet Launcher v__VERSION__'
          releaseBody: 'This is Packet Launcher.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
