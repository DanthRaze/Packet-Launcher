name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: macos-latest
            name: "MacOS Universal"

          - os: windows-latest
            name: "Windows x64"
            target: "x86_64-pc-windows-msvc"

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust Toolchain + Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      #
      # =========================
      # MACOS UNIVERSAL BUILD
      # =========================
      #

      - name: Build macOS Intel
        if: matrix.os == 'macos-latest'
        run: |
          npm run tauri build -- \
            --target x86_64-apple-darwin \
            --bundles app,dmg

        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build macOS Apple Silicon
        if: matrix.os == 'macos-latest'
        run: |
          npm run tauri build -- \
            --target aarch64-apple-darwin \
            --bundles app,dmg

        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create Universal macOS App
        if: matrix.os == 'macos-latest'
        run: |
          APP_NAME="Packet Launcher.app"

          mkdir -p target/universal-macos

          APP_PATH=$(find target/x86_64-apple-darwin/release/bundle -type d -name "$APP_NAME" | head -n 1)

          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app bundle"
            exit 1
          fi

          cp -R "$APP_PATH" "target/universal-macos/$APP_NAME"

          lipo -create \
            "target/x86_64-apple-darwin/release/packet-launcher" \
            "target/aarch64-apple-darwin/release/packet-launcher" \
            -output "target/universal-macos/$APP_NAME/Contents/MacOS/packet-launcher"

      - name: Create Universal DMG
        if: matrix.os == 'macos-latest'
        run: |
          npm install -g create-dmg

          mkdir -p target/final

          create-dmg \
            "target/universal-macos/Packet Launcher.app" \
            target/final

      - name: Rename DMG
        if: matrix.os == 'macos-latest'
        run: |
          DMG_FILE=$(find target/final -name "*.dmg" | head -n 1)

          mv "$DMG_FILE" \
             "target/final/Packet-Launcher-macos-universal.dmg"

      - name: Create Universal tar.gz
        if: matrix.os == 'macos-latest'
        run: |
          cd target/universal-macos
          tar -czf ../final/Packet-Launcher-macos-universal.tar.gz "Packet Launcher.app"

      - name: Sign Universal tar.gz
        if: matrix.os == 'macos-latest'
        run: |
          npx tauri signer sign \
            --private-key "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" \
            target/final/Packet-Launcher-macos-universal.tar.gz

      - name: Upload Universal macOS Assets
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/final/*.dmg
            target/final/*.tar.gz
            target/final/*.sig

      #
      # =========================
      # WINDOWS BUILD
      # =========================
      #

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Packet Launcher v__VERSION__"
          releaseBody: "Automated release from GitHub Actions"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc